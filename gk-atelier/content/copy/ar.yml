privacy:
  title: سياسة الخصوصية
  description: كيف يتعامل موقع GK Atelier مع معلوماتكم.
  heading: سياسة الخصوصية
  # Change this date whenever the privacy text changes (YYYY-MM-DD).
  updated_on: "2026-10-19"
  updated: "آخر تحديث: {date}"
  sections:
    - title: باختصار
      text:
        - >-
          لا يطلب منكم هذا الموقع إنشاء حساب، ولا يستقبل مدفوعات، ولا يستخدم
          ملفات تعريف الارتباط للإعلانات أو التحليلات.
    - title: نموذج الاستفسار وواتساب
      text:
        - >-
          عند استخدام نموذج الطلبات الخاصة، تبقى بياناتكم في متصفحكم. وعند الضغط
          على الزر توضع في رسالة واتساب على جهازكم، ولا يُرسل شيء إلا إذا اخترتم
          إرسال الرسالة بأنفسكم.
        - >-
          عند إرسال الرسالة، تصل إلى غادة عبر واتساب وتخضع لشروط واتساب وسياسة
          الخصوصية الخاصة به. تستخدم غادة رسائلكم فقط للرد على استفساركم وترتيب
          طلبكم.
        - >-
          تُرفق الصور المرجعية مباشرة في واتساب، ولا تُرفع أبدًا على هذا الموقع.
    - title: معلومات تُحفظ على جهازكم
      text:
        - >-
          يتذكّر الموقع اللغة التي اخترتموها (العربية أو الإنجليزية) في التخزين
          المحلي لمتصفحكم، ليفتح الموقع بلغتكم في المرة القادمة. يمكنكم حذفها في
          أي وقت من إعدادات المتصفح.
    - title: الاستضافة
      text:
        - >-
          كما هو الحال في معظم المواقع، قد تحتفظ شركة الاستضافة بسجلات تقنية
          اعتيادية (مثل عناوين IP والصفحات المطلوبة) لأغراض الأمان ولضمان عمل
          الموقع.
    - title: أسئلة
      text:
        - >-
          إن كان لديكم سؤال عن معلوماتكم، أو أردتم من غادة حذف رسائلكم، يُرجى
          التواصل معها عبر واتساب.

