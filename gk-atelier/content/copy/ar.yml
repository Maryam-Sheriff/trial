about:
  title: عن غادة خليل — الفنانة وراء GK Atelier
  description: >-
    تعرّفوا على غادة خليل، الحِرفية وراء GK Atelier — مرسم شخصي في مصر يصنع
    التطريز والمكرمية والكروشيه والرسم على الحرير وتذكارات الزفاف والهدايا
    المخصّصة يدويًا.
  eyebrow: عن غادة
  heading: بأنامل غادة خليل
  lead: >-
    GK Atelier هو أتيليه غادة خليل الخاص — مكان تتحوّل فيه الخيوط والحبال
    والصوف والحرير والألوان إلى قطع تُصنع لشخص بعينه.
  sections:
    - title: صُنعت على مهل، عن قصد
      text:
        - >-
          لا شيء في GK Atelier يُنتج بكميات كبيرة. كل قطعة تُطرَّز أو تُعقد أو
          تُشغل بالكروشيه أو تُرسم باليد، وهذا يحتاج إلى وقت. وفي هذا الوقت
          تكمن العناية: في اختيار ألوان متناغمة، وفي غرز منتظمة صبورة، وفي
          لمسات أخيرة تليق بالمناسبة.
    - title: لماذا العمل اليدوي؟
      text:
        - >-
          تحمل القطعة اليدوية ما لا تستطيع الآلة تقليده — تلك العلامات الصغيرة
          التي تقول إن إنسانًا صنعها لإنسان. ولهذا تُحفظ الهدايا اليدوية وتُتوارث
          وتبقى في الذاكرة طويلًا بعد المناسبة نفسها.
    - title: صُنعت لمناسبتكم
      text:
        - >-
          كثير من القطع يبدأ بحديث: مناسبة، أو اسم، أو لون، أو إحساس. تناقش
          غادة كل طلب بنفسها، لتشعروا أن القطعة النهائية صُنعت لكم أنتم.
  story_title: بكلمات غادة
  story: []
  crafts_title: حِرف الأتيليه
  crafts_text: تعمل غادة بمجموعة متنوعة من الحرف اليدوية.
  process_title: داخل الأتيليه
  process_text: مساحة العمل، والأدوات، والقطع وهي تتشكّل.
  cta_title: هل تودّون قطعة تُصنع لكم؟
  cta_text: أخبروا غادة بفكرتكم، وسترشدكم إلى ما يمكن تنفيذه.

custom:
  title: الطلبات الخاصة — هدايا يدوية مخصّصة
  description: >-
    اطلبوا قطعة يدوية مخصّصة من GK Atelier: ألوان حسب اختياركم، وأسماء، وتطريز،
    وأطقم هدايا، وتصاميم للأعراس والمواليد والمناسبات الخاصة. استفسروا عبر واتساب.
  eyebrow: الطلبات الخاصة
  heading: صُنعت خصيصًا لكم
  lead: >-
    في بالكم فكرة أو مناسبة أو اسم؟ شاركونا التفاصيل أدناه، وسنجهّز لكم رسالة
    واتساب لترسلوها إلى غادة.
  options_title: يسعدنا أن تسألوا عن
  how_title: كيف يتم ذلك
  how:
    - املؤوا النموذج بالقدر الذي ترغبون به من التفاصيل.
    - يفتح واتساب وفيه استفساركم مكتوبًا. راجعوه ثم اضغطوا إرسال.
    - ترد غادة لتناقش معكم التصميم والسعر والموعد.
  enquiry_notice_title: استفسار وليس طلبًا
  enquiry_notice: >-
    إرسال هذا الاستفسار لا يعني تقديم طلب أو حجز موعد أو تأكيد التوفّر. سترد
    غادة عبر واتساب لمناقشة ما يمكن تنفيذه والسعر والموعد — ولا يبدأ العمل إلا
    بعد اتفاقكما.
