home:
  title: هدايا وتذكارات مصنوعة يدويًا في مصر والخليج
  description: >-
    تذكارات زفاف وتطريز ومكرمية وهدايا مواليد ورسم على الحرير وكروشيه وهدايا
    مخصّصة، مصنوعة يدويًا بيد غادة خليل. استفسروا واطلبوا عبر واتساب من مصر
    والخليج.
