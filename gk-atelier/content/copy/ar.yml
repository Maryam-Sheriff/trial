    - >-
      GK Atelier هو أتيليه غادة خليل الخاص. كل قطعة ترونها هنا صنعتها
      بيدها — تطريزًا أو عقدًا أو كروشيه أو رسمًا — بصبرٍ واهتمامٍ بأدق التفاصيل.
