about:
  title: About Ghada Khalil — The Artisan Behind GK Atelier
  description: >-
    Meet Ghada Khalil, the artisan behind GK Atelier — a personal studio in
    Egypt creating handmade embroidery, macramé, crochet, silk painting,
    wedding keepsakes and personalized gifts.
  eyebrow: About Ghada
  heading: The hands behind GK Atelier
  lead: >-
    GK Atelier is the personal studio of Ghada Khalil — a place where thread,
    cord, yarn, silk and colour become pieces made for someone in particular.
  sections:
    - title: Made slowly, on purpose
      text:
        - >-
          Nothing at GK Atelier is mass-produced. Every piece is stitched,
          knotted, crocheted or painted by hand, and that takes time. The time
          is where the care goes: in choosing colours that belong together,
          in even, patient stitches, and in a finish that does justice to
          the occasion.
    - title: Why handmade matters
      text:
        - >-
          A handmade piece carries something a machine can't copy — the small
          signs that it was made by a person, for a person. That is why
          handmade gifts are kept, passed on and remembered long after the
          day itself.
    - title: Made for your moment
      text:
        - >-
          Many pieces begin with a conversation: an occasion, a name, a
          colour, a feeling. Ghada talks each request through personally, so
          the finished piece feels like it was always meant for you.
  # Ghada's own words. Leave empty ([]) until Ghada has written or approved
  # them — this section only appears once it has text.
  story_title: In Ghada's words
  story: []
  crafts_title: The crafts of the atelier
  crafts_text: Ghada works across a range of handmade techniques.
  process_title: Inside the atelier
  process_text: The workspace, the tools and the pieces as they take shape.
  cta_title: Would you like something made for you?
  cta_text: Tell Ghada about your idea and she'll guide you through what's possible.

custom:
  title: Custom Orders — Personalized Handmade Gifts
  description: >-
    Request a personalized handmade piece from GK Atelier: custom colours,
    names, embroidery, gift sets and designs for weddings, new babies and
    special occasions. Enquire through WhatsApp.
  eyebrow: Custom orders
  heading: Made especially for you
  lead: >-
    Have an idea, an occasion or a name in mind? Share the details below and
    we'll prepare a WhatsApp message for you to send to Ghada.
  options_title: You're welcome to ask about
  how_title: How it works
  how:
    - Fill in the form with as much or as little detail as you like.
    - WhatsApp opens with your enquiry written out. Review it, then press send.
    - Ghada replies to talk through the design, price and timing with you.
  enquiry_notice_title: An enquiry, not an order
  enquiry_notice: >-
    Sending this enquiry doesn't place an order, reserve a date or confirm
    availability. Ghada will reply on WhatsApp to discuss what's possible,
    the price and the timing — nothing is made until you both agree.
  form:
    title: Your enquiry
    required_note: Fields marked * are required.
    name: Your name
    occasion: Occasion or purpose
    occasion_placeholder: Choose an occasion
    occasions:
      - Wedding or engagement
      - New baby
      - Birthday
      - Ramadan or Eid
      - Graduation
      - A gift for someone special
      - For my home
      - Something else
    type: Type of creation
    type_placeholder: Choose a type
    type_unsure: Not sure yet
    description: Describe the piece you have in mind
    description_hint: >-
      Size, style, the feeling you'd like it to have — anything that helps
      Ghada picture it.
    personalization: Preferred colours or personalization
    personalization_hint: e.g. colours, a name or initials, a date, a short message
    date: Date you need it by
    date_hint: Ghada will let you know whether the timing is possible.
    optional: optional
    reference_title: Have a reference photo?
    reference_text: >-
      Once WhatsApp opens, you can attach photos or inspiration directly to
      your message. Photos are never uploaded to this website.
    submit: Continue to WhatsApp
    privacy: >-
      Your details are not sent to or stored on this website. They are only
      placed into a WhatsApp message on your own device, which you can review
      before sending.
    privacy_link: Privacy notice
    errors:
      summary: Please check the following
      name: Please enter your name.
      occasion: Please choose an occasion or purpose.
      type: Please choose a type of creation, or "Not sure yet".
      description: Please describe the piece in a few words (at least 10 characters).
      date: Please choose a date that is today or later.
    labels:
      name: Name
      occasion: Occasion
      type: Type of creation
      description: Description
      personalization: Colours / personalization
      date: Needed by
    success_title: Your message is ready in WhatsApp
    success_text: >-
      WhatsApp should now be open with your enquiry. Please review it and
      press send — Ghada will reply to discuss the details.
    success_fallback: Didn't open? Open WhatsApp
    success_edit: Edit my details
    preview_title: Your message

