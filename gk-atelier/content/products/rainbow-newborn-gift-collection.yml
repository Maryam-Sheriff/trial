description:
  en: >-
    A coordinated welcome collection in ivory and shades of blue, with the
    baby's name on every piece: a macramé cloud name sign with a rainbow and
    leaf hangings; a cushion with a macramé rainbow, wooden letters and
    pompoms; a hoop with a baby asleep on the moon and a prayer; and a gift box
    holding a bodysuit, a hat, mittens and a wrap embroidered with rainbows.
    Shown with a crochet teddy bear.
  ar: >-
    مجموعة متناسقة لاستقبال المولود بالعاجي ودرجات الأزرق، وكل قطعة فيها تحمل
    اسم الطفل: لوحة اسم من المكرمية على شكل غيمة مع قوس قزح وأوراق متدلّية،
    ووسادة بقوس قزح من المكرمية وحروف خشبية وكرات صوف صغيرة، وطارة عليها طفل نائم
    على الهلال مع دعاء، وعلبة هدية تضم بودي وطاقية وقفازات ولفّة مطرّزة بقوس قزح.
    تظهر في الصورة مع دبدوب من الكروشيه.
