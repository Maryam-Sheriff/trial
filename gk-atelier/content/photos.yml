# ─────────────────────────────────────────────────────────────────────────────
#  Photographs for the homepage and the About page
#
#  1. Copy the photo into the images/atelier folder (JPG, PNG or WebP —
#     large originals are fine, the website makes smaller copies itself).
#  2. Write its path after "src:" and describe what it shows after "en:" and
#     "ar:" (this description is read aloud to blind visitors and helps Google).
#  Only real photographs of Ghada's own work belong here. Any slot left empty
#  shows a clearly labelled "photograph coming soon" placeholder.
# ─────────────────────────────────────────────────────────────────────────────

# The large photograph at the top of the homepage. A portrait (tall) photo of
# a finished piece or a beautiful detail works best. While this is empty, the
# homepage opens with the logo instead.
