name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/cinematic-wedding-invitation-hwnqa9
  # Deploys fail for reasons that have nothing to do with the site — Pages
  # answering 503 is the usual one. Recover by dispatching a NEW run from
  # here, never by re-running the failed one: "Upload site" would run a
  # second time and leave the run holding two artifacts named github-pages,
  # which deploy-pages refuses outright. A failed deploy is best left failed.
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Serve files as-is; without this Jekyll would try to build the site
      - name: Disable Jekyll processing
        run: touch .nojekyll

      # index.html carries a hash of script.js and style.css in its asset
      # URLs so a phone cannot run yesterday's script against today's markup.
      #
      # The stamp is committed rather than applied here, because this workflow
      # is not the only thing that publishes the site: GitHub's built-in
      # pages-build-deployment also fires on every push and serves the branch
      # exactly as committed. The two race, and the built-in one usually wins,
      # so anything this job rewrites is discarded. Verify instead of rewrite —
      # then it does not matter which deployer lands last.
      - name: Check asset version stamps are current
        run: python3 tools/stamp.py --check

      # Requires Pages to be switched on once by hand:
      #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      # It cannot be enabled from here: creating a Pages site needs admin
      # rights that the workflow's GITHUB_TOKEN is never granted.
      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
