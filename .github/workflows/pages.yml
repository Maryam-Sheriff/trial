name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/cinematic-wedding-invitation-hwnqa9
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Serve files as-is; without this Jekyll would try to build the site
      - name: Disable Jekyll processing
        run: touch .nojekyll

      # index.html asks for style.css?v=dev and script.js?v=dev. Stamp the
      # commit into those query strings so a deploy can never be half-applied:
      # a phone holding yesterday's script.js in its cache would otherwise keep
      # running it against today's markup, and the fix would look like it had
      # not shipped. A new commit means a new URL, so the browser must refetch.
      #
      # The check at the end is the point. The first attempt at this step ran
      # clean — bash, exit 0, green tick — and changed nothing, and the deploy
      # shipped an unstamped page anyway. sed reports success when its pattern
      # matches nothing, so "the step passed" says only that sed ran. Assert
      # the file actually changed, or the silent no-op just comes back.
      - name: Stamp asset versions
        env:
          SHA: ${{ github.sha }}
        run: |
          sed -i "s|?v=dev|?v=${SHA:0:8}|g" index.html
          grep -n -E '(script\.js|style\.css)\?v=' index.html
          if grep -q '?v=dev' index.html; then
            echo "::error::asset version stamp did not apply — index.html still asks for ?v=dev"
            exit 1
          fi

      # Requires Pages to be switched on once by hand:
      #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      # It cannot be enabled from here: creating a Pages site needs admin
      # rights that the workflow's GITHUB_TOKEN is never granted.
      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
